<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Post a Project — Talentrek</title>
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/css/style.css"/>
</head><body class="font-display bg-background-light text-text-light">
<header class="border-b p-4">
  <div class="container mx-auto flex justify-between items-center">
    <a href="index.html" class="flex items-center gap-3"><svg class="h-8 w-8 text-primary" viewBox="0 0 48 48" fill="none"><path fill="currentColor" d="M6 24a18 18 0 1 0 36 0 18 18 0 0 0-36 0z"/></svg><span class="font-bold">Talentrek</span></a>
    <a href="getting-started.html" class="text-sm">Getting Started</a>
  </div>
</header>

<main class="container mx-auto p-6">
  <h1 class="text-2xl font-bold mb-4">Post a Project</h1>
  <form id="post-form" class="space-y-4 bg-card-light p-6 rounded shadow-soft">
    <div><label class="block text-sm font-medium">Project Title</label><input required name="title" class="w-full mt-1 p-3 border rounded" placeholder="e.g. Social media campaign"/></div>
    <div><label class="block text-sm font-medium">Category</label><select name="category" class="w-full mt-1 p-3 border rounded"><option>Marketing</option><option>Design</option><option>Technology</option></select></div>
    <div><label class="block text-sm font-medium">Description</label><textarea name="description" class="w-full mt-1 p-3 border rounded" rows="5"></textarea></div>
    <div class="flex gap-2"><button type="submit" class="bg-primary text-white px-4 py-2 rounded">Post Project</button><a href="dashboard.html" class="px-4 py-2 border rounded">Cancel</a></div>
  </form>
  <div id="msg" class="mt-4"></div>
</main>

<script src="assets/js/main.js"></script>
</body></html>
